# Counterpart to net-client-vanish-quiet: OLR sends nothing for 150 s, more than idle + interval * count (120 s). The
# client's kernel answers OLR's keepalive probes, so the connection stays and carries row 11.
[olr]
state_interval_s = 10

[[step]]
client = "connect"
[[step]]
sql = "INSERT INTO olrt_advn13.t VALUES (10, 'before', 10)"
[[step]]
sql = "COMMIT"
[[step]]
read = "commits"
count = 1
[[step]]
client = "commit_offset"
[[step]]
read = "idle"
idle = 150
[[step]]
sql = "INSERT INTO olrt_advn13.t VALUES (11, 'after quiet', 11)"
[[step]]
sql = "COMMIT"
[[step]]
read = "commits"
count = 1
timeout = 30
[[step]]
expect_olr_log_absent = "network error|host disconnected"
[[step]]
expect_olr_log = "new client connection"
[[step]]
client = "commit_offset"
