[olr]
queue_size = 65536

[[step]]
client = "connect"
[[step]]
sql = "UPDATE olrt_advn6.t SET v = 'warmup' WHERE id = 1"
[[step]]
sql = "COMMIT"
[[step]]
read = "commits"
count = 1
[[step]]
client = "commit_offset"
[[step]]
sql = "INSERT INTO olrt_advn6.t SELECT 1000 + LEVEL, 'big-' || LEVEL, LEVEL / 1000, DATE '2026-01-01' + MOD(LEVEL, 365) FROM dual CONNECT BY LEVEL <= 20000"
[[step]]
switch_logfile = true
[[step]]
sql = "INSERT INTO olrt_advn6.w (id, c2, c255, c256, c257, c299, c300) SELECT 1000 + LEVEL, 'w' || LEVEL, DATE '2027-01-01', LEVEL / 7, 'p2-' || LEVEL, 'hi-' || LEVEL, DATE '2028-01-01' + LEVEL FROM dual CONNECT BY LEVEL <= 500"
[[step]]
sql = "COMMIT"
[[step]]
read = "messages"
count = 700
timeout = 60
[[step]]
client = "commit_offset"
[[step]]
client = "disconnect"
[[step]]
olr = "restart"
signal = "KILL"
delete_writer_checkpoint = true
[[step]]
client = "connect"
[[step]]
read = "idle"
idle = 10
[[step]]
client = "commit_offset"
[[step]]
sql = "INSERT INTO olrt_advn6.t VALUES (2, 'after', 2, DATE '2026-02-02')"
[[step]]
sql = "COMMIT"
[[step]]
read = "commits"
count = 1
