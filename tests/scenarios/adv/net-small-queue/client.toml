[[step]]
sql = "COMMIT"
[[step]]
read = "messages"
count = 150
[[step]]
client = "commit_offset"
[[step]]
read = "messages"
count = 150
timeout = 15
[[step]]
client = "commit_offset"
[[step]]
read = "idle"
idle = 10
[[step]]
client = "commit_offset"
[[step]]
sql = "INSERT INTO olrt_advn4.t VALUES (2, 'after', 2, SYSDATE)"
[[step]]
