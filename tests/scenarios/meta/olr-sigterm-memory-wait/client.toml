# The client stops confirming, a large transaction fills the 4 MB builder buffer, the parser waits for memory, then
# OLR is stopped with SIGTERM (a pod stop while Debezium is slow)
[olr]
stop_signal = "TERM"

[[step]]
client = "connect"
[[step]]
sql = "UPDATE olrt_termw.t SET v = 'two' WHERE id = 1"
[[step]]
sql = "COMMIT"
[[step]]
read = "commits"
count = 1
[[step]]
client = "commit_offset"
[[step]]
sql = "INSERT INTO olrt_termw.t SELECT 1 + LEVEL, RPAD('row ' || LEVEL, 400, 'x') FROM dual CONNECT BY LEVEL <= 50000"
[[step]]
sql = "COMMIT"
[[step]]
sleep = 20
