# Everything is delivered, then OLR is stopped with SIGTERM (what docker stop and a Kubernetes pod stop send)
[olr]
stop_signal = "TERM"

[[step]]
client = "connect"
[[step]]
sql = "UPDATE olrt_term.t SET v = 'two' WHERE id = 1"
[[step]]
sql = "INSERT INTO olrt_term.t VALUES (2, 'new')"
[[step]]
sql = "COMMIT"
[[step]]
read = "commits"
count = 1
[[step]]
client = "commit_offset"
