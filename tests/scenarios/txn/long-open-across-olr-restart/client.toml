# T_long begins first (session 2) and stays open; T_short and T_short2 commit and are
# delivered; the client stores the offset Debezium 3.6.1 would store.
[[step]]
client = "connect"
[[step]]
sql = "INSERT INTO olrt_a1s.t VALUES (100, 'long-1', 1)"
session = 2
[[step]]
sleep = 1
[[step]]
sql = "UPDATE olrt_a1s.t SET v = 'short' WHERE id = 1"
[[step]]
sql = "COMMIT"
[[step]]
read = "commits"
count = 1
[[step]]
client = "commit_offset"
[[step]]
sql = "INSERT INTO olrt_a1s.t VALUES (2, 'short-2', 2)"
[[step]]
sql = "COMMIT"
[[step]]
read = "commits"
count = 1
[[step]]
client = "commit_offset"

[[step]]
client = "disconnect"
[[step]]
olr = "restart"
delete_writer_checkpoint = true
signal = "INT"
[[step]]
client = "connect"

[[step]]
sql = "INSERT INTO olrt_a1s.t VALUES (101, 'long-2', 2)"
session = 2
[[step]]
sql = "COMMIT"
session = 2
[[step]]
read = "idle"
idle = 8
