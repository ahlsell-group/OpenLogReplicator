[connector]
snapshot_mode = "no_data"
[olr]
state_interval_s = 3
[[step]]
connector = "create"
[[step]]
sql = "INSERT INTO olrt_sc1.t VALUES (10, 10, 'olr phase')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 8
[[step]]
olr = "stop"
[[step]]
connector = "adapter"
adapter = "logminer"
[[step]]
expect_task = "RUNNING"
within = 60
[[step]]
sql = "INSERT INTO olrt_sc1.t VALUES (11, 11, 'logminer phase, short 1')"
[[step]]
sql = "COMMIT"
[[step]]
sql = "UPDATE olrt_sc1.t SET txt = 'open across the switch back' WHERE id = 1"
session = 2
[[step]]
sql = "INSERT INTO olrt_sc1.t VALUES (12, 12, 'logminer phase, short 2')"
[[step]]
sql = "COMMIT"
[[step]]
sql = "INSERT INTO olrt_sc1.t SELECT 100 + LEVEL, LEVEL, 'logminer phase, bulk ' || LEVEL FROM dual CONNECT BY LEVEL <= 500"
[[step]]
sql = "COMMIT"
[[step]]
sql = "INSERT INTO olrt_sc1.t VALUES (13, 13, 'logminer phase, short 3')"
[[step]]
sql = "COMMIT"
[[step]]
switch_logfile = true
[[step]]
sql = "INSERT INTO olrt_sc1.t VALUES (14, 14, 'logminer phase, short 4')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 10
timeout = 120
[[step]]
olr = "start"
delete_writer_checkpoint = true
[[step]]
connector = "adapter"
adapter = "olr"
[[step]]
expect_task = "RUNNING"
within = 90
[[step]]
sql = "INSERT INTO olrt_sc1.t VALUES (20, 20, 'open tx, after switch back')"
session = 2
[[step]]
sql = "COMMIT"
session = 2
[[step]]
sql = "INSERT INTO olrt_sc1.t VALUES (15, 15, 'olr phase 2')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 10
timeout = 180
