[connector]
snapshot_mode = "no_data"
config = { "openlogreplicator.confirm.within.transactions" = "true" }
[olr]
queue_size = 2000

[[step]]
connector = "create"
[[step]]
sql = "INSERT INTO olrt_mt1.t VALUES (10, 10, 'before')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 4
[[step]]
sql = "INSERT INTO olrt_mt1.t SELECT 1000 + LEVEL, LEVEL, 'bulk ' || LEVEL FROM dual CONNECT BY LEVEL <= 20000"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 15
timeout = 300
[[step]]
sql = "INSERT INTO olrt_mt1.t VALUES (11, 11, 'after')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 8
timeout = 120
