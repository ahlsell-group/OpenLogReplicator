[connector]
snapshot_mode = "no_data"
heartbeat_ms = 60000
final_task_state = "RUNNING"
config = { "openlogreplicator.confirm.completed.transactions" = "true", "topic.creation.groups" = "small", "topic.creation.small.include" = ".*\\.OLRT_CF6\\.T", "topic.creation.small.max.message.bytes" = "3000", "topic.creation.small.replication.factor" = "1", "topic.creation.small.partitions" = "1", "topic.creation.small.cleanup.policy" = "delete" }

[[step]]
connector = "create"
[[step]]
sql = "INSERT INTO olrt_cf6.t (id, qty, txt) VALUES (9, 9, 'creates the topic')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 6
[[step]]
sql = "INSERT INTO olrt_cf6.t (id, qty, txt) VALUES (10, 10, 'T, small row before')"
[[step]]
sql = "INSERT INTO olrt_cf6.t (id, qty, txt, big1, big2) VALUES (11, 11, 'T, too large', DBMS_RANDOM.STRING('x', 3990), DBMS_RANDOM.STRING('x', 3990))"
[[step]]
sql = "INSERT INTO olrt_cf6.t (id, qty, txt) VALUES (12, 12, 'T, small row after')"
[[step]]
sql = "COMMIT"
[[step]]
expect_task = "FAILED"
within = 90
[[step]]
sleep = 5
[[step]]
rpk = "topic alter-config {prefix}.OLRT_CF6.T --set max.message.bytes=1048576"
[[step]]
connector = "restart_task"
[[step]]
expect_task = "RUNNING"
within = 60
[[step]]
sql = "INSERT INTO olrt_cf6.t (id, qty, txt) VALUES (13, 13, 'after the restart')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 10
timeout = 180
