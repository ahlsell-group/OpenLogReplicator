[connector]
snapshot_mode = "no_data"
config = { "openlogreplicator.confirm.within.transactions" = "true" }
[olr]
queue_size = 2000

[[step]]
connector = "create"
[[step]]
sql = "INSERT INTO olrt_mh2.t VALUES (10, 10, 'before')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 4
[[step]]
sql = "INSERT INTO olrt_mh2.t SELECT 1000 + LEVEL, LEVEL, 'bulk ' || LEVEL FROM dual CONNECT BY LEVEL <= 20000"
[[step]]
sql = "COMMIT"
[[step]]
wait = "rows"
min_records = 6000
idle = 0.5
timeout = 120
[[step]]
connector = "pause"
settle = 6
[[step]]
connector = "restart_task"
mid_rows = 20000
[[step]]
connector = "resume"
[[step]]
expect_task = "RUNNING"
[[step]]
expect_olr_log = "client requested scn: \\d+, idx: [1-9]"
[[step]]
expect_log = "Server continues after SCN \\d+ index [1-9]"
[[step]]
wait = "idle"
idle = 15
timeout = 300
[[step]]
sql = "INSERT INTO olrt_mh2.t VALUES (11, 11, 'after')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 8
timeout = 120
