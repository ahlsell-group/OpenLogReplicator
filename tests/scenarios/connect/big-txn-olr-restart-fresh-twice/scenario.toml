description = "Two OLR restarts without writer checkpoint (START) inside one 40000-row transaction"
tags = ["connect", "queue", "mid-tx-confirm"]
tables = ["OLRT_MH4.T"]
allowed_warnings = ["^10061 network error"]
checks = ["run", "diff", "replay", "txmeta"]
exactly_once = true

[known_issue]
"run@3.7.0.Final" = "Debezium 3.7.0.Final confirms (offset scn, 0) while a transaction is emitted, so OLR keeps all of its messages; with more than queue-size (2000) the writer queue fills (WARN 60040), the writer stops and the rest of the transaction and everything after it never arrive"
