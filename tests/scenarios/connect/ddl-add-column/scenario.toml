[known_issue]
"delivery@debezium" = "flags 0: OLR sends no DDL, Debezium never learns NEWCOL/NEWNUM, so they are missing from the topic schema and every row image"
"diff@debezium" = "flags 0: NEWCOL/NEWNUM missing from the topic"
"replay@debezium" = "flags 0: NEWCOL/NEWNUM missing from the topic"
"replay@debezium-ddl" = "rows untouched since ADD COLUMN ... DEFAULT 0 NOT NULL read 0 in the DB, but no change event carries that (metadata-only default; LogMiner CDC behaves the same)"
