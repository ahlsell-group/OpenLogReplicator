description = "Connect: NUMBER scale (0.000, 12.500), NUMBER below 1e-128 and at 9.99e125, BINARY_FLOAT/DOUBLE through real Debezium"
tags = ["connect", "types", "number"]
tables = ["OLRT_CV.T"]

# fixed by fork fix/number-tiny + fix/binary-float-double: xfail on images without them, PASS required on the fixed_in images
fixed_in = ["olrt/olr:local*", "olrt/olr:2.0.0-ahlsell.3*", "olrt/olr:ahlsell-rc3*"]

