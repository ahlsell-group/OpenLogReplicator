[connector]
config = { "openlogreplicator.confirm.completed.transactions" = "true" }
snapshot_mode = "no_data"
heartbeat_ms = 60000
[olr]
queue_size = 200

[[step]]
connector = "create"
[[step]]
sql = "INSERT INTO olrt_cf4.t VALUES (10, 10, 'before the quiet period')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 6
[[step]]
sql_file = "noise.sql"
[[step]]
sleep = 5
[[step]]
worker = "kill"
[[step]]
expect_task = "RUNNING"
within = 60
[[step]]
sql = "INSERT INTO olrt_cf4.t VALUES (11, 11, 'after the quiet period')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "rows"
min_records = 1
timeout = 90
[[step]]
wait = "idle"
[[step]]
# option on: the task continues after the completed transaction, not at the start of its SCN
expect_olr_log = "client requested scn: \\d+, idx: [1-9]"
