# Dev 2026-10-29: an Argo sync replaced the OLR pod and no FIN or RST reached the Connect pod; the socket stayed
# ESTABLISHED with no timer and the task RUNNING without progress. Here the inbound packets of the established
# connection are dropped in the Connect container, then OLR restarts. With keepalive (idle 60 s, interval 10 s,
# count 6) the read fails about 120 s after the last traffic, the IOException is retriable and the task
# reconnects to the new OLR without a manual restart.
[connector]
snapshot_mode = "no_data"
heartbeat_ms = 60000
[olr]
state_interval_s = 10

[[step]]
connector = "create"
[[step]]
sql = "INSERT INTO olrt_cka.t VALUES (10, 10, 'before')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 4
[[step]]
# the CONFIRM for row 10 is sent and acknowledged, so the connection is idle with nothing in flight
sleep = 5
[[step]]
netns = "ss -tno state established '( dport = :5000 )'"
[[step]]
olr = "vanish"
signal = "INT"
delete_writer_checkpoint = true
[[step]]
sql = "INSERT INTO olrt_cka.t VALUES (11, 11, 'after')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "rows"
min_records = 1
timeout = 300
[[step]]
expect_task = "RUNNING"
[[step]]
sql = "INSERT INTO olrt_cka.t VALUES (12, 12, 'after reconnect')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 8
[[step]]
netns = "ss -tno state established '( dport = :5000 )'"
