[connector]
snapshot_mode = "no_data"
config = { "internal.custom.retriable.exception" = ".*Connection lost.*" }
[olr]
state_interval_s = 10
[[step]]
connector = "create"
[[step]]
sql = "INSERT INTO olrt_c10.t VALUES (10, 10, 'a')"
[[step]]
sql = "COMMIT"
[[step]]
sql = "UPDATE olrt_c10.t SET txt = 'long, open across OLR restart' WHERE id = 1"
session = 2
[[step]]
sql = "INSERT INTO olrt_c10.t VALUES (11, 11, 'b')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 4
[[step]]
sleep = 12
[[step]]
olr = "restart"
signal = "INT"
delete_writer_checkpoint = true
[[step]]
sleep = 15
[[step]]
expect_task = "RUNNING"
[[step]]
sql = "INSERT INTO olrt_c10.t VALUES (100, 100, 'long, after restart')"
session = 2
[[step]]
sql = "COMMIT"
session = 2
[[step]]
sql = "INSERT INTO olrt_c10.t VALUES (12, 12, 'c')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 8
