[connector]
snapshot_mode = "no_data"
final_task_state = "FAILED"
config = { "internal.custom.retriable.exception" = ".*Connection lost.*", "errors.max.retries" = "3" }
[olr]
state_interval_s = 10
[[step]]
connector = "create"
[[step]]
sql = "INSERT INTO olrt_c14.t VALUES (10, 10, 'boundary')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 4
timeout = 90
[[step]]
olr = "stop"
[[step]]
sleep = 120
[[step]]
olr = "start"
[[step]]
sleep = 30
[[step]]
sql = "INSERT INTO olrt_c14.t VALUES (11, 11, 'after start')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 8
timeout = 90
