[connector]
snapshot_mode = "no_data"
adapter = "logminer"
[olr]
autostart = false
[[step]]
connector = "create"
[[step]]
sql = "INSERT INTO olrt_sw5.t VALUES (10, 10, 'before rollback, committed')"
[[step]]
sql = "COMMIT"
[[step]]
sql = "UPDATE olrt_sw5.t SET txt = 'open across the rollback' WHERE id = 1"
session = 2
[[step]]
sql = "INSERT INTO olrt_sw5.t VALUES (20, 20, 'open tx, before rollback')"
session = 2
[[step]]
sql = "INSERT INTO olrt_sw5.t VALUES (11, 11, 'committed before rollback')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 8
timeout = 120
[[step]]
worker = "upgrade"
version = "3.2.2.Final"
[[step]]
expect_task = "RUNNING"
within = 120
[[step]]
sql = "INSERT INTO olrt_sw5.t VALUES (21, 21, 'open tx, after rollback')"
session = 2
[[step]]
sql = "COMMIT"
session = 2
[[step]]
sql = "INSERT INTO olrt_sw5.t VALUES (12, 12, 'after rollback, committed')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 10
timeout = 180
