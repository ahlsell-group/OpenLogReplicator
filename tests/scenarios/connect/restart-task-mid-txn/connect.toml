[connector]
snapshot_mode = "no_data"
[olr]
queue_size = 65536
[[step]]
connector = "create"
[[step]]
sql = "INSERT INTO olrt_c6.t VALUES (10, 10, 'before')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 4
[[step]]
sql = "INSERT INTO olrt_c6.t SELECT 1000 + LEVEL, LEVEL, 'bulk ' || LEVEL FROM dual CONNECT BY LEVEL <= 50000"
[[step]]
sql = "COMMIT"
[[step]]
wait = "rows"
min_records = 2000
idle = 0.5
timeout = 60
[[step]]
connector = "restart_task"
mid_rows = 50000
[[step]]
expect_task = "RUNNING"
[[step]]
wait = "idle"
idle = 10
timeout = 240
[[step]]
sql = "INSERT INTO olrt_c6.t VALUES (11, 11, 'after')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
