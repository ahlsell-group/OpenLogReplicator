description = "Adapter swap OLR -> LogMiner on the same connector while a transaction is open across the swap"
tags = ["connect", "swap"]
tables = ["OLRT_SW1.T"]
allowed_warnings = ["^10061 network error"]

[known_issue]
delivery = "adapter swap OLR -> LogMiner: LogMiner mines from the offset scn, which is the commit SCN of the last transaction OLR delivered (AbstractLogMinerStreamingChangeEventSource takes no pending-transaction detour without snapshot_scn), so the rows a transaction wrote before the swap are never mined and it arrives partial; swap-olr-to-logminer-rewind shows the lossless procedure"
diff = "adapter swap OLR -> LogMiner: rows written before the swap by a transaction committed after it are lost (see delivery)"
replay = "adapter swap OLR -> LogMiner: rows written before the swap by a transaction committed after it are lost (see delivery)"
