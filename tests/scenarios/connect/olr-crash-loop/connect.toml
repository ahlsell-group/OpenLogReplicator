[connector]
snapshot_mode = "no_data"
final_task_state = { "3.6.1.Final" = "RUNNING", "3.7.0.Final" = "FAILED" }
config = { "internal.custom.retriable.exception" = ".*Connection lost.*", "errors.max.retries" = "3" }
[olr]
state_interval_s = 10
[[step]]
connector = "create"
[[step]]
sql = "INSERT INTO olrt_c13.t VALUES (10, 10, 'boundary')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 4
timeout = 90
[[step]]
olr = "restart"
signal = "KILL"
delete_writer_checkpoint = true
[[step]]
sleep = 15
[[step]]
olr = "restart"
signal = "KILL"
delete_writer_checkpoint = true
[[step]]
sleep = 15
[[step]]
olr = "restart"
signal = "KILL"
delete_writer_checkpoint = true
[[step]]
sleep = 15
[[step]]
olr = "restart"
signal = "KILL"
delete_writer_checkpoint = true
[[step]]
sleep = 15
[[step]]
olr = "restart"
signal = "KILL"
delete_writer_checkpoint = true
[[step]]
sleep = 15
[[step]]
wait = "idle"
idle = 10
timeout = 120
[[step]]
sql = "INSERT INTO olrt_c13.t VALUES (11, 11, 'after loop')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 8
timeout = 90
