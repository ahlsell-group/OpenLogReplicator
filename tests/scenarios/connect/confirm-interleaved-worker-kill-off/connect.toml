[connector]
config = { "openlogreplicator.confirm.completed.transactions" = "false" }
snapshot_mode = "no_data"
heartbeat_ms = 60000
[olr]

[[step]]
connector = "create"
[[step]]
sql = "UPDATE olrt_cf1o.t SET txt = 'T2, open across the restart' WHERE id = 1"
session = 2
[[step]]
sql = "INSERT INTO olrt_cf1o.t VALUES (20, 20, 'T2 before T1 commits')"
session = 2
[[step]]
sql = "INSERT INTO olrt_cf1o.t VALUES (10, 10, 'T1, begins after T2')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 6
[[step]]
sql_file = "noise.sql"
[[step]]
sleep = 12
[[step]]
worker = "kill"
[[step]]
expect_task = "RUNNING"
within = 60
[[step]]
sql = "INSERT INTO olrt_cf1o.t VALUES (21, 21, 'T2 after the restart')"
session = 2
[[step]]
sql = "COMMIT"
session = 2
[[step]]
sql = "INSERT INTO olrt_cf1o.t VALUES (11, 11, 'T3 after the restart')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 10
timeout = 180
[[step]]
# option off: the task continues at the start of its offset SCN (Final.7 behaviour)
expect_olr_log = "client requested scn: \\d+, idx: 0"
[[step]]
expect_olr_log_absent = "client requested scn: \\d+, idx: [1-9]"
