[connector]
config = { "openlogreplicator.confirm.completed.transactions" = "true" }
snapshot_mode = "no_data"
heartbeat_ms = 60000
[olr]
state_interval_s = 10

[[step]]
connector = "create"
[[step]]
sql = "UPDATE olrt_cf3.t SET txt = 'T2, open across the restart' WHERE id = 1"
session = 2
[[step]]
sql = "INSERT INTO olrt_cf3.t VALUES (20, 20, 'T2 before T1 commits')"
session = 2
[[step]]
sql = "INSERT INTO olrt_cf3.t VALUES (10, 10, 'T1, begins after T2')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 6
[[step]]
sql_file = "noise.sql"
[[step]]
sleep = 12
[[step]]
olr = "restart"
signal = "INT"
[[step]]
expect_task = "FAILED"
within = 30
[[step]]
connector = "restart_task"
[[step]]
expect_task = "RUNNING"
within = 60
[[step]]
sql = "INSERT INTO olrt_cf3.t VALUES (21, 21, 'T2 after the restart')"
session = 2
[[step]]
sql = "COMMIT"
session = 2
[[step]]
sql = "INSERT INTO olrt_cf3.t VALUES (11, 11, 'T3 after the restart')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 10
timeout = 180
[[step]]
# OLR restarted from its writer checkpoint has confirmed nothing in its run, so the CONTINUE is clamped to the start of the offset SCN
expect_olr_log = "client requested scn: \\d+, idx: 0"
[[step]]
expect_olr_log_absent = "client requested scn: \\d+, idx: [1-9]"
