description = "Cold start (empty OLR state) with snapshot.mode=no_data while a transaction that began two logs earlier is open"
tags = ["connect", "restart", "a2"]
tables = ["OLRT_C12.T"]

# fixed by fork 84c8b7f9 (start at the oldest open transaction): must pass on the release candidate
fixed_in = ["olrt/olr:local*", "olrt/olr:2.0.0-ahlsell.3*", "olrt/olr:ahlsell-rc3*"]

[known_issue]
delivery = "cold-start boundary: the long transaction began in a redo log before the one holding START; OLR 2.0.0 reads from that log on and never sends the transaction (TRACE: no events for its xid); fork 84c8b7f9 starts at the oldest open transaction"
