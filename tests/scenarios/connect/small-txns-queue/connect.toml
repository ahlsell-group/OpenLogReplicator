[connector]
snapshot_mode = "no_data"
config = { "openlogreplicator.confirm.within.transactions" = "true" }
[olr]
queue_size = 2000

[[step]]
connector = "create"
[[step]]
sql = "INSERT INTO olrt_mt7.t VALUES (10, 10, 'before')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 4
[[step]]
sql_file = "workload.sql"
[[step]]
wait = "idle"
idle = 10
timeout = 300
[[step]]
connector = "restart_task"
[[step]]
expect_task = "RUNNING"
[[step]]
sql = "INSERT INTO olrt_mt7.t VALUES (11, 11, 'after')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 8
