description = "DBMS_REDEFINITION (QTY NUMBER(15,3) -> NUMBER(18,4), EXTRA new), then MODIFY QTY NUMBER(20,6) and DROP COLUMN EXTRA, all while OLR is down; Debezium (OLR adapter) reaches the post-swap rows only after both DDLs"
tags = ["connect", "ddl", "redefinition"]
tables = ["OLRT_CR6.T"]
logminer_dict = "redo"
allowed_warnings = ["^10061 network error"]

[known_issue]
"delivery@3.7.0.Final-ahlsell.9" = "keeps the pre-redefinition model: QTY values needing scale 4 or 6 arrive as null, EXTRA is never in the topic schema"
"diff@3.7.0.Final-ahlsell.9" = "as delivery"
"replay@3.7.0.Final-ahlsell.9" = "as delivery"
"delivery@3.7.0.Final-ahlsell.10" = "reference limitation: LogMiner decodes with the dictionary after DROP COLUMN extra, so it has no EXTRA; Debezium emits the EXTRA values the rows were written with ('set', 'new', 'modified', 'm')"
"diff@3.7.0.Final-ahlsell.10" = "as delivery"
"replay@3.7.0.Final-ahlsell.10" = "profile debezium only (no DDL messages): after DROP COLUMN the model still has EXTRA and the before-image of the next update carries it as null (detection is one-directional)"
