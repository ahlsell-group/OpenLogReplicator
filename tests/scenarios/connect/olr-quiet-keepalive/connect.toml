# OLR sends nothing while the database is quiet (no SHOW_CHECKPOINT). Keepalive must not turn that into a failure:
# 330 s is more than twice idle + interval * count (120 s), and the same connection (local port) must carry the
# row after it, without a producer failure or retry in the Connect log.
[connector]
snapshot_mode = "no_data"
heartbeat_ms = 60000
[olr]
state_interval_s = 10

[[step]]
connector = "create"
[[step]]
sql = "INSERT INTO olrt_ckq.t VALUES (10, 10, 'before')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 4
[[step]]
netns = "ss -tno state established '( dport = :5000 )'"
[[step]]
# polls the topics (a plain sleep would exceed the harness consumer's max.poll.interval)
wait = "idle"
idle = 165
timeout = 200
[[step]]
netns = "ss -tno state established '( dport = :5000 )'"
[[step]]
# polls the topics (a plain sleep would exceed the harness consumer's max.poll.interval)
wait = "idle"
idle = 165
timeout = 200
[[step]]
netns = "ss -tno state established '( dport = :5000 )'"
[[step]]
sql = "INSERT INTO olrt_ckq.t VALUES (11, 11, 'after quiet')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 8
[[step]]
netns = "ss -tno state established '( dport = :5000 )'"
[[step]]
expect_log_absent = "Producer failure|Retry \\d+ of|Connection timed out"
[[step]]
expect_task = "RUNNING"
