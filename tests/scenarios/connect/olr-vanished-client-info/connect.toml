# OLR serves one client (listen backlog 1, no keepalive on the accepted socket). Here the task's connection is
# silenced in both directions, so OLR keeps it, and the task is restarted: its new connection waits in OLR's backlog
# and INFO is not answered. With openlogreplicator.info.timeout.ms the task fails retriably with a message naming
# the cause and connects again; once the old connection is released, OLR serves the new one and rows 11 and 12 arrive.
[connector]
snapshot_mode = "no_data"
heartbeat_ms = 60000
config = { "openlogreplicator.info.timeout.ms" = "15000" }
[olr]
state_interval_s = 10

[[step]]
connector = "create"
[[step]]
sql = "INSERT INTO olrt_cki.t VALUES (10, 10, 'before')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 4
[[step]]
sleep = 5
[[step]]
netns = "ss -tno state established '( dport = :5000 )'"
[[step]]
olr = "silence"
[[step]]
connector = "restart_task"
settle = 5
[[step]]
sql = "INSERT INTO olrt_cki.t VALUES (11, 11, 'while OLR holds the old socket')"
[[step]]
sql = "COMMIT"
[[step]]
# polls the topics; long enough for at least one INFO timeout (15 s) and a retry
wait = "idle"
idle = 45
timeout = 60
[[step]]
netns = "ss -tno '( dport = :5000 )'"
[[step]]
expect_log = "did not answer the INFO request within 15000 ms"
[[step]]
expect_task = "RUNNING"
[[step]]
olr = "unsilence"
[[step]]
wait = "rows"
min_records = 1
timeout = 400
[[step]]
sql = "INSERT INTO olrt_cki.t VALUES (12, 12, 'after reconnect')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 8
[[step]]
netns = "ss -tno state established '( dport = :5000 )'"
