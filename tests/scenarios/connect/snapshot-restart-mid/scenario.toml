description = "Task restart and then a worker kill in the middle of an incremental snapshot (64-row chunks, 60000 rows, each after 5000 more records): the snapshot resumes from the chunk key in the offsets and every row arrives"
tags = ["connect", "snapshot", "keycols"]
tables = ["OLRT_K4.T", "OLRT_K4.STREAM", "OLRT_K4.DBZ_SIGNAL"]
olr_timeout = 3600
ignore_watermarks = "OLRT_K4.DBZ_SIGNAL"
expect_incremental = ["OLRT_K4.T"]
allowed_warnings = ["^10061 network error"]
