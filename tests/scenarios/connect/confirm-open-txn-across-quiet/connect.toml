[connector]
config = { "openlogreplicator.confirm.completed.transactions" = "true" }
snapshot_mode = "no_data"
heartbeat_ms = 60000
[olr]
queue_size = 200
state_interval_s = 10

[[step]]
connector = "create"
[[step]]
sql = "INSERT INTO olrt_cf5.t VALUES (20, 20, 'T2 before the quiet period')"
session = 2
[[step]]
sql = "INSERT INTO olrt_cf5.t VALUES (10, 10, 'T1')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 6
[[step]]
sql_file = "noise.sql"
[[step]]
sleep = 12
[[step]]
olr = "restart"
signal = "INT"
delete_writer_checkpoint = true
[[step]]
expect_task = "FAILED"
within = 30
[[step]]
connector = "restart_task"
[[step]]
expect_task = "RUNNING"
within = 60
[[step]]
wait = "idle"
idle = 6
[[step]]
worker = "kill"
[[step]]
expect_task = "RUNNING"
within = 60
[[step]]
sql = "INSERT INTO olrt_cf5.t VALUES (21, 21, 'T2 after the restart')"
session = 2
[[step]]
sql = "COMMIT"
session = 2
[[step]]
sql = "INSERT INTO olrt_cf5.t VALUES (11, 11, 'T3 after the restart')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 10
timeout = 180
[[step]]
# option on: the task continues after the completed transaction, not at the start of its SCN
expect_olr_log = "client requested scn: \\d+, idx: [1-9]"
