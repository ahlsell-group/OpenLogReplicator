[connector]
snapshot_mode = "no_data"
adapter = "logminer"
[olr]
autostart = false
[[step]]
connector = "create"
[[step]]
sql = "INSERT INTO olrt_sw3.t VALUES (10, 10, 'before swap, committed')"
[[step]]
sql = "COMMIT"
[[step]]
sql = "UPDATE olrt_sw3.t SET txt = 'open across the swap' WHERE id = 1"
session = 2
[[step]]
sql = "INSERT INTO olrt_sw3.t VALUES (20, 20, 'open tx, before swap')"
session = 2
[[step]]
sql = "INSERT INTO olrt_sw3.t VALUES (11, 11, 'committed before swap, re-sent by OLR')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 8
timeout = 120
[[step]]
olr = "start"
[[step]]
connector = "adapter"
adapter = "olr"
[[step]]
expect_task = "RUNNING"
within = 90
[[step]]
sql = "INSERT INTO olrt_sw3.t VALUES (21, 21, 'open tx, after swap')"
session = 2
[[step]]
sql = "COMMIT"
session = 2
[[step]]
sql = "INSERT INTO olrt_sw3.t VALUES (12, 12, 'after swap, committed')"
[[step]]
sql = "COMMIT"
[[step]]
wait = "idle"
idle = 10
timeout = 180
