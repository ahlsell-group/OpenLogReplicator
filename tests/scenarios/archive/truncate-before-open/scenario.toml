description = "Archived log already truncated to 60 % of its size when OLR opens it"
tags = ["archive", "archive-fault"]
checks = ["run", "gap"]
fixed_in = ["olrt/olr:local*", "olrt/olr:2.0.0-ahlsell.3*", "olrt/olr:ahlsell-rc3*"]
tables = ["OLRT_AV.T"]
olr_timeout = 240
olr_trace = 64
[olr_source]
arch-read-sleep-us = 1000000
arch-read-tries = 5
[archive_fault]
index = 1
action = "truncate"
when = "before"
slow_us = 300000
keep = 0.6
[known_issue]
gap = "a file shorter than its header block count is read to its end and reported FINISHED, no ERROR at all, exit 0; fix: fork fix/archive-short-read (ERROR 40012)"
