description = "Every read of the archived log returns 0 bytes (EOF) once OLR is reading it"
tags = ["archive", "archive-fault"]
checks = ["run", "gap"]
fixed_in = ["olrt/olr:local*", "olrt/olr:2.0.0-ahlsell.3*", "olrt/olr:ahlsell-rc3*"]
tables = ["OLRT_AV.T"]
olr_timeout = 240
olr_trace = 64
[olr_source]
arch-read-sleep-us = 1000000
arch-read-tries = 5
[archive_fault]
index = 1
action = "zero"
when = "open"
slow_us = 300000
[known_issue]
gap = "the short read is taken for the end of the log: FINISHED, next sequence, rows missing, exit 0 (ERROR 10005 only); fix: fork fix/archive-short-read (ERROR 40013)"
