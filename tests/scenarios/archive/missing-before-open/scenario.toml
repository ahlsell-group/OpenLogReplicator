description = "Archived log removed after V$ARCHIVED_LOG lists it and before OLR opens it"
tags = ["archive", "archive-fault"]
checks = ["run", "gap"]
tables = ["OLRT_AV.T"]
olr_timeout = 240
olr_trace = 64
[olr_source]
arch-read-sleep-us = 1000000
arch-read-tries = 5
[archive_fault]
index = 1
action = "rm"
when = "before"
slow_us = 300000
