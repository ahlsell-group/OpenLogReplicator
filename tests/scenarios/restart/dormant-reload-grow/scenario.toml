description = "dormant transaction updates U, filter reloaded from {T} to {T, U}, restart"
tags = ["restart", "network", "dormant"]
tables = ["OLRT_DRM13.T", "OLRT_DRM13.U"]
olr_timeout = 900
allowed_warnings = ["^10061 network error, errno: 32", "^60010 no match found for transaction rollback"]
expect_log = ["filter changed: transactions open now"]
forbid_log = ["60011", "50039", "60061"]
