[olr]
queue_size = 65536
dormant_max = 1000

[[step]]
client = "connect"
[[step]]
sql = "INSERT INTO OLRT_DRM6.t VALUES (2, 'before')"
[[step]]
sql = "COMMIT"
[[step]]
read = "commits"
count = 1
[[step]]
read = "idle"
idle = 3
[[step]]
client = "commit_offset"
[[step]]
sql = "UPDATE OLRT_DRM6.u SET v = 'dormant' WHERE id = 1"
session = 2
[[step]]
sql = "SAVEPOINT a"
session = 2
[[step]]
sql = "UPDATE OLRT_DRM6.u SET v = 'dormant 2' WHERE id = 2"
session = 2
[[step]]
sql = "UPDATE OLRT_DRM6.u SET v = 'second dormant' WHERE id = 3"
session = 3
[[step]]
sql = "UPDATE OLRT_DRM6.u SET v = 'third' WHERE id = 4"
session = 4
[[step]]
sql = "SAVEPOINT b"
session = 4
[[step]]
sql = "INSERT INTO OLRT_DRM6.t VALUES (20, 'rolled back before the checkpoint')"
session = 4
[[step]]
sql = "ROLLBACK TO SAVEPOINT b"
session = 4
[[step]]
sleep = 3
[[step]]
switch_logfile = true
count = 2
[[step]]
sleep = 5
[[step]]
sql = "INSERT INTO OLRT_DRM6.t VALUES (3, 'after checkpoint')"
[[step]]
sql = "COMMIT"
[[step]]
read = "commits"
count = 1
[[step]]
read = "idle"
idle = 3
[[step]]
client = "commit_offset"
[[step]]
client = "disconnect"
[[step]]
olr = "stop"
signal = "KILL"
delete_writer_checkpoint = true
[[step]]
olr = "start"
[[step]]
client = "connect"
[[step]]
read = "idle"
idle = 8
[[step]]
sql = "ROLLBACK TO SAVEPOINT a"
session = 2
[[step]]
sql = "INSERT INTO OLRT_DRM6.t VALUES (21, 'after rollback to savepoint a')"
session = 2
[[step]]
sql = "COMMIT"
session = 2
[[step]]
read = "commits"
count = 1
[[step]]
sql = "INSERT INTO OLRT_DRM6.t VALUES (22, 'rolled back whole')"
session = 3
[[step]]
sql = "ROLLBACK"
session = 3
[[step]]
sql = "INSERT INTO OLRT_DRM6.t VALUES (23, 'after the restart')"
session = 4
[[step]]
sql = "COMMIT"
session = 4
[[step]]
read = "commits"
count = 1
