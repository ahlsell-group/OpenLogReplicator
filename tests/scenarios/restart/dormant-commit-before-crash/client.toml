[olr]
queue_size = 65536
dormant_max = 1000

[[step]]
client = "connect"
[[step]]
sql = "INSERT INTO OLRT_DRM8.t VALUES (2, 'before')"
[[step]]
sql = "COMMIT"
[[step]]
read = "commits"
count = 1
[[step]]
read = "idle"
idle = 3
[[step]]
client = "commit_offset"
[[step]]
sql = "UPDATE OLRT_DRM8.u SET v = 'dormant' WHERE id = 1"
session = 2
[[step]]
sql = "UPDATE OLRT_DRM8.u SET v = 'dormant' WHERE id = 2"
session = 3
[[step]]
sleep = 3
[[step]]
switch_logfile = true
count = 2
[[step]]
sleep = 5
[[step]]
sql = "INSERT INTO OLRT_DRM8.t VALUES (3, 'after checkpoint')"
[[step]]
sql = "COMMIT"
[[step]]
read = "commits"
count = 1
[[step]]
read = "idle"
idle = 3
[[step]]
client = "commit_offset"
[[step]]
sql = "INSERT INTO OLRT_DRM8.t VALUES (10, 'committed before the crash')"
session = 2
[[step]]
sql = "COMMIT"
session = 2
[[step]]
sql = "INSERT INTO OLRT_DRM8.t VALUES (11, 'rolled back before the crash')"
session = 3
[[step]]
sql = "ROLLBACK"
session = 3
[[step]]
client = "disconnect"
[[step]]
olr = "stop"
signal = "KILL"
delete_writer_checkpoint = true
[[step]]
olr = "start"
[[step]]
client = "connect"
[[step]]
read = "idle"
idle = 8
[[step]]
sql = "INSERT INTO OLRT_DRM8.t VALUES (12, 'after the restart')"
[[step]]
sql = "COMMIT"
[[step]]
read = "commits"
count = 1
[[step]]
read = "idle"
idle = 3
[[step]]
client = "commit_offset"
