[olr]
queue_size = 65536
dormant_max = 1000
filter_tables = ["OLRT_DRM12.T", "OLRT_DRM12.U"]
[[step]]
client = "connect"
[[step]]
sql = "INSERT INTO OLRT_DRM12.t VALUES (2, 'before')"
[[step]]
sql = "COMMIT"
[[step]]
read = "commits"
count = 1
[[step]]
read = "idle"
idle = 3
[[step]]
client = "commit_offset"
[[step]]
olr = "reconfigure"
config = { filter_tables = ["OLRT_DRM12.T"] }
[[step]]
sql = "UPDATE OLRT_DRM12.u SET v = 'dormant' WHERE id = 1"
session = 2
[[step]]
sleep = 3
[[step]]
switch_logfile = true
count = 2
[[step]]
sleep = 5
[[step]]
sql = "INSERT INTO OLRT_DRM12.t VALUES (3, 'after checkpoint')"
[[step]]
sql = "COMMIT"
[[step]]
read = "commits"
count = 1
[[step]]
read = "idle"
idle = 3
[[step]]
client = "commit_offset"
[[step]]
client = "disconnect"
[[step]]
olr = "stop"
signal = "KILL"
delete_writer_checkpoint = true
[[step]]
olr = "start"
config = { filter_tables = ["OLRT_DRM12.T", "OLRT_DRM12.U"] }
[[step]]
client = "connect"
[[step]]
read = "idle"
idle = 8
[[step]]
sql = "INSERT INTO OLRT_DRM12.u VALUES (100, 'after the restart')"
session = 2
[[step]]
sql = "INSERT INTO OLRT_DRM12.t VALUES (4, 'from the dormant transaction')"
session = 2
[[step]]
sql = "COMMIT"
session = 2
[[step]]
read = "commits"
count = 1
